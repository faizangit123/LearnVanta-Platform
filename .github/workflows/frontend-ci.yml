name: Frontend CI (Vite)

on:
  push:
    branches: [main, develop]
    paths:
      - 'EadStream-Frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'EadStream-Frontend/**'

env:
  NODE_VERSION: '20'

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EadStream-Frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: EadStream-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
