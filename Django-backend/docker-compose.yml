version: '3.8'

services:
  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  db:
    image: postgres:15-alpine
    container_name: edustream_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edustream
      POSTGRES_USER: edustream_user
      POSTGRES_PASSWORD: edustream_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edustream_user -d edustream"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Django Backend (Gunicorn)
  # -----------------------------
  web:
    build: .
    container_name: edustream_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 edustream_backend.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"   # exposed ONLY to nginx
    environment:
      - DEBUG=True
      - SECRET_KEY=your-super-secret-key-change-this
      - DATABASE_URL=postgres://edustream_user:edustream_secret_password@db:5432/edustream
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------
  # Nginx Reverse Proxy (DEV)
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: edustream_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

# -----------------------------
# Volumes
# -----------------------------
volumes:
  postgres_data:
  static_volume:
  media_volume:
