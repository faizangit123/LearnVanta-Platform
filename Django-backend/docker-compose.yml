services:
  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  db:
    image: postgres:15-alpine
    container_name: edustream_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Django Backend (Gunicorn)
  # -----------------------------
  web:
    build: .
    container_name: edustream_web
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn edustream_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------
  # Nginx Reverse Proxy
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: edustream_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

# -----------------------------
# Volumes
# -----------------------------
volumes:
  postgres_data:
  static_volume:
  media_volume:
